version: 2
updates:
  # Keeps the actions current. Dependabot bumps a `@vX` or `<sha> # vX.Y.Z`
  # pin to the new release. A `<sha> # main` pin (meridianlabs-ai/actions,
  # until a release tag has the shared Python actions) moves to that branch's
  # head, with no cooldown. The cooldown gives a compromised release time to be
  # caught before it is proposed; security updates skip it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per week for every action update, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml, and
  # its exclude list matches the "6 hours" and false entries in
  # `exclude-newer-package` there (a dated emergency entry is locked by hand):
  # Dependabot's cooldown counts whole days, so those packages' cooldown is
  # left to uv. They get their own group, so a broken update elsewhere can't
  # hold them up. It comes first because a package that matches both groups
  # goes to the first.
  - package-ecosystem: "uv"
    versioning-strategy: "lockfile-only"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "anthropic"
        - "inspect-ai"
        - "inspect-scout"
        - "openai"
    groups:
      six-hour-cooldown:
        patterns:
          - "anthropic"
          - "inspect-ai"
          - "inspect-scout"
          - "openai"
      python-packages:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
